<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Offline AI Text to Speech</title>

<script src="https://cdn.jsdelivr.net/gh/steveseguin/espeakng.js/espeakng-simple.js"></script>

<style>

body{
font-family: Arial;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:#1e293b;
padding:30px;
border-radius:10px;
width:400px;
text-align:center;
}

textarea{
width:100%;
height:120px;
padding:10px;
margin-top:10px;
border-radius:5px;
border:none;
}

button{
margin-top:15px;
padding:10px 20px;
background:#3b82f6;
border:none;
color:white;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#2563eb;
}

select{
margin-top:10px;
padding:8px;
width:100%;
}

</style>

</head>

<body>

<div class="container">

<h2>Offline AI Text to Speech</h2>

<textarea id="text">
Hello Mangesh, your offline AI voice is ready
</textarea>

<select id="voice">
<option value="en">English</option>
<option value="hi">Hindi</option>
<option value="mr">Marathi</option>
</select>

<button id="speakBtn">Speak</button>

</div>

<script>

let tts;

window.onload = function(){

tts = new SimpleTTS();

document.getElementById("speakBtn").addEventListener("click", speak);

}

function speak(){

const text = document.getElementById("text").value;
const voice = document.getElementById("voice").value;

tts.onReady(() => {

tts.speak(text, {
voice: voice,
speed: 130,
pitch: 50
}, (audioData, sampleRate) => {

SimpleTTS.playAudioData(audioData, sampleRate);

});

});

}

</script>

</body>
</html>
